<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Knockers" />
    <title>Knockers — door tracker</title>
  </head>
  <body>
    <div id="map"></div>

    <!-- Brand pill (top-left, over a thin scrim) -->
    <div id="brand"><span class="brand-dot"></span>Knockers</div>

    <!-- Recenter / follow my location (top-right, below zoom) -->
    <button id="recenter-btn" class="map-ctrl" type="button" aria-label="Recenter on my location"></button>

    <!-- A brief status message that floats above the sheet (errors / hints) -->
    <div id="toast" hidden></div>

    <!-- Bottom sheet. Its header holds the actions, so they're always reachable. -->
    <section id="sheet">
      <div id="sheet-peek">
        <button id="sheet-handle" type="button" aria-label="Drag to resize the list">
          <span class="grip"></span>
        </button>
        <div id="actions">
          <button id="here-fab" class="act act-primary" type="button">I’m here</button>
          <button id="add-fab" class="act" type="button">Tap-add</button>
          <button id="scout-fab" class="act" type="button">Scout</button>
        </div>
        <div id="tally" class="tally">No houses logged yet</div>
      </div>

      <div id="sheet-body">
        <!-- List view -->
        <div id="list-view">
          <div id="filter-chips" class="chips"></div>
          <ul id="knock-list"></ul>
          <button id="export-btn" class="wide-btn ghost" type="button">Export CSV</button>
        </div>

        <!-- Editor view (one house) -->
        <div id="editor-view" hidden></div>

        <!-- Score view (area scout) -->
        <div id="score-view" hidden></div>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
